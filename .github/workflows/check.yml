# Vérification de chaque envoi et de chaque pull request : les types, les tests, les cartes livrées
name: Vérification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Les tests jouent de vraies batailles et des dizaines de secondes de simulation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run map:check

  # La simulation compilée (crates/casse-sim, Rust) : ses tests, puis les deux modules reconstruits ici
  # (le module embarqué, et la simulation entière, src/shared/native/casse-sim.wasm), vérifiés contre le
  # TypeScript (tests/native.test.ts : mêmes entrées, mêmes sorties au bit près ; tests/nativeSession.test.ts :
  # les mêmes images que la session et la salle du TypeScript)
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # (la version de rust-toolchain.toml, et sa cible WebAssembly : rustup la prend ensuite d'elle-même)
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - run: npm run native:test
      # (la simulation entière est aussi la sonde, dans target/probe/ : Rapier 0.36 compilé ici contre
      # celui du jeu, et la simulation portée, comparée à celle du TypeScript au bit près)
      - run: npm run native
      - run: npx vitest run tests/native.test.ts tests/nativePhysics.test.ts tests/nativeSim.test.ts tests/nativeSession.test.ts

  # Le rendu : le jeu construit, dans Chrome sans carte graphique (SwiftShader) ; chaque écran se
  # dessine sans erreur ni shader qui ne compile pas, et survit à une perte du contexte WebGL
  render:
    runs-on: ubuntu-latest
    # (sans carte graphique, chaque écran prend deux à trois minutes, et le passage WebGPU démarre aussi le jeu)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render:check
      # Le même parcours sous WebGPU, si le Chrome de la machine d'intégration l'offre sans carte
      # graphique (sinon l'essai le dit et passe : il est fait sur une vraie carte avant chaque envoi)
      - run: npm run render:check -- --no-build --renderer=webgpu --optional
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: artifacts/render-check/
